# ============================================================================
# config.yaml -- ALL source material and ALL tunable parameters for the build.
# The Snakefile hard-codes nothing tunable: to change inputs or any threshold,
# edit this file only. Provenance of every non-obvious choice is documented in
# README.md ("Parameter provenance"); inline comments here point to it.
#
# The build runs in FOUR phases with a human break between each (see README):
#   Phase 0  contamination screen on the primaries        [make {iso}.remove.txt]
#   Phase A  prep(decontam) -> purge -> scaffold -> QC     [set cut_sites]
#   Phase B  apply cuts -> re-QC -> cross-isolate corresp. [set consensus]
#   Phase C  build consensus -> contamination net -> final QC
# ============================================================================

isolates: [MA, MM]
threads: 32

workdir: /n/netscratch/informatics/Lab/tsackton/rotifer-assembly-20260723

# ---- software is provisioned by Snakemake, NOT by paths --------------------
# conda envs in envs/*.yaml (rule `conda:` directives) + the FCS-GX container.
# Run with:  snakemake --sw-deployment-method conda apptainer ...
# (scripts are found relative to the Snakefile via workflow.basedir/scripts).

# ============================================================================
# INPUTS
# ============================================================================
# 1. primary assemblies -- hifiasm --ont primary contigs, FCS-GX + FCS-adaptor
#    screened. Provenance chain + caveats in assemblies-prelim/README.md. NB these
#    still carry residual bacterial contamination that Phase 0 removes.
primary:
  MA: /n/holylfs05/LABS/informatics/Lab/projects/tsackton/rotifers/assembly-build-20260723/assemblies-prelim/MA.clean_no_adap.p_ctg.fa
  MM: /n/holylfs05/LABS/informatics/Lab/projects/tsackton/rotifers/assembly-build-20260723/assemblies-prelim/MM.clean_no_adap.p_ctg.fa

# 2. ONT reads -- FINALIZED length-filtered (>=10 kb) sets, both runs pooled per
#    isolate. Made upstream; the pipeline consumes these directly (does NOT re-filter).
#    EXACT provenance (source runs, 10 kb threshold, command) is documented in
#    source-data/ont-2024-filt/README.md next to the files.
ont_reads:
  MA: /n/holylfs05/LABS/informatics/Lab/projects/tsackton/rotifers/assembly-build-20260723/source-data/ont-2024-filt/MA.ont.filt10k.fastq.gz
  MM: /n/holylfs05/LABS/informatics/Lab/projects/tsackton/rotifers/assembly-build-20260723/source-data/ont-2024-filt/MM.ont.filt10k.fastq.gz

# 3. 10x linked reads for ARKS -- ALL lanes per isolate (L002 + L003).
#    Isolate identity RESOLVED: 4228-MM-0004 = MA, 4228-MM-0005 = MM (0006 = 3rd
#    sample, unused). R1 carries a 16 bp barcode at bp 1-16.
tenx_R1:
  MA: [/n/holylfs05/LABS/informatics/Lab/projects/tsackton/rotifers/assembly-build-20260723/source-data/laine-et-al-seq/4228-MM-0004_S2_L002_R1_001.fastq.gz,
       /n/holylfs05/LABS/informatics/Lab/projects/tsackton/rotifers/assembly-build-20260723/source-data/laine-et-al-seq/4228-MM-0004_S2_L003_R1_001.fastq.gz]
  MM: [/n/holylfs05/LABS/informatics/Lab/projects/tsackton/rotifers/assembly-build-20260723/source-data/laine-et-al-seq/4228-MM-0005_S3_L002_R1_001.fastq.gz,
       /n/holylfs05/LABS/informatics/Lab/projects/tsackton/rotifers/assembly-build-20260723/source-data/laine-et-al-seq/4228-MM-0005_S3_L003_R1_001.fastq.gz]
tenx_R2:
  MA: [/n/holylfs05/LABS/informatics/Lab/projects/tsackton/rotifers/assembly-build-20260723/source-data/laine-et-al-seq/4228-MM-0004_S2_L002_R2_001.fastq.gz,
       /n/holylfs05/LABS/informatics/Lab/projects/tsackton/rotifers/assembly-build-20260723/source-data/laine-et-al-seq/4228-MM-0004_S2_L003_R2_001.fastq.gz]
  MM: [/n/holylfs05/LABS/informatics/Lab/projects/tsackton/rotifers/assembly-build-20260723/source-data/laine-et-al-seq/4228-MM-0005_S3_L002_R2_001.fastq.gz,
       /n/holylfs05/LABS/informatics/Lab/projects/tsackton/rotifers/assembly-build-20260723/source-data/laine-et-al-seq/4228-MM-0005_S3_L003_R2_001.fastq.gz]
barcode_len: 16                 # 10x Genomics GEM barcode length (chemistry-fixed)

# ============================================================================
# PHASE 0 -- prep reference (contamination screen on the PRIMARIES)
# ============================================================================
# Screen each primary with (a) a FRESH current-db FCS-GX run and (b) a
# blobtools-style GC/coverage/taxonomy analysis, because the ORIGINAL FCS-GX
# (db build 2023-01-24) under-detected: it removed 5 contigs but left ~65 Mb of
# high-GC contigs in MM, incl. 5 circular (complete) bacterial genomes.
# Phase 0 emits, per primary (in {workdir}/{iso}/prep/):
#   {iso}.contam_report.tsv       data: per-contig GC, coverage, taxonomy, calls, reason
#   {iso}.remove_candidates.txt   auto-flagged contig names (SUPERSET, for review)
#   {iso}.blob.png / .gc_hist.png / .cov_hist.png   evaluation plots
# >>> PAUSE: review the report + plots, then create {iso}/prep/{iso}.remove.txt
#     (the VERIFIED removal list; `cp` the candidates if you agree with all). <<<
# prep_reference (first rule of Phase A) drops {iso}.remove.txt from the primary,
# so the ENTIRE downstream build + QC run on the decontaminated assembly.
prep:
  cov_reads: ont                 # coverage source for the blob plot (the filtered ONT set)
  # --- FCS-GX, FRESH run with a CURRENT db, via the fcs.py wrapper + Singularity
  #     (NCBI FCS-GX quickstart; same approach as dkhost's screen.slurm). The
  #     rule fcsgx_tools curls fcs.py + fcs-gx.sif; fetch_gxdb runs `fcs.py db get`. ---
  run_fcsgx: true                # false = skip FCS-GX (blobtools screen still runs); no db/container needed
  fcsgx_tooldir:  /n/netscratch/informatics/Lab/tsackton/rotifer_tmp/fcsgx_tools
  fcs_py_url:     https://github.com/ncbi/fcs/raw/main/dist/fcs.py
  fcsgx_sif_url:  https://ftp.ncbi.nlm.nih.gov/genomes/TOOLS/FCS/releases/latest/fcs-gx.sif
  fcsgx_db_dir:   /n/netscratch/informatics/Lab/tsackton/rotifer_tmp/gxdb   # fetch_gxdb syncs here (~470 GB)
  fcsgx_manifest: https://ncbi-fcs-gx.s3.amazonaws.com/gxdb/latest/all.manifest   # per the FCS-GX quickstart
  fcsgx_taxid:    104788         # M. quadricornifera -> anml:rotifers (dkhost used 5962; both resolve to rotifers)
  # --- blobtools-style taxonomy (blastn vs nt, DB-split scatter; see contam:) ---
  blob_gc_flag: 0.45             # GC above this -> window + BLAST + flag candidate (rotifer host ~0.30)
  blob_windows_per_contig: 20
  blob_window_bp: 2000

# ============================================================================
# PHASE A (purge) + PHASE B (scaffold + QC)
# ============================================================================
ont_map_preset: map-ont         # minimap2 preset for ONT read depth (purge + QC)
purge:
  self_preset: asm5             # minimap2 self-alignment preset (purge_dups standard)
  self_flags: "-DP"             # purge_dups self-aln flags (standard)
  # calcuts cutoffs, PER ISOLATE ("" = calcuts auto-detects). Start both on auto:
  # phaseA STOPS after purge so you review {iso}/purge/{iso}.purge_hist.png + cutoffs
  # (purge_stats.txt) before scaffolding. If calcuts mis-reads the depth histogram, set
  # manual "-l <low> -m <valley> -u <high>" here from the OBSERVED full-data peaks and
  # re-run phaseA. NB an EARLIER PARTIAL-data run had MM bimodal ~58x/116x and calcuts
  # mis-called it haploid; those old values (-l 25 -m 85 -u 180) are STALE for the full
  # data (peaks shift) -- re-derive from the histogram, do not reuse.
  calcuts_opts:
    MA: ""
    MM: ""
  get_seqs_opts: "-e"           # purge haplotypic dups only at contig ends (conservative)

# ---- post-purge VALIDATION QC  (target: phaseA_qc) -------------------------
# Is hap.fa (what purge REMOVED) genuinely redundant haplotypic sequence, or did
# purge over-cut UNIQUE content? Ohnologs are irrelevant here -- they are deeply
# diverged / unalignable, so purge_dups' self-alignment never acts on them.
# Checked three independent ways: compleasm markers (over/under-purge), a
# hap->purged alignment (does each removed contig map back to a retained copy),
# and coverage on the combined purged+hap reference from BOTH ONT and 10x
# (a real haplotypic dup reads ~half the retained/diploid depth).
purge_qc:
  compleasm_lineage: metazoa_odb10   # BUSCO-style markers (bdelloid -> metazoa_odb10)
  compleasm_libdir: /n/netscratch/informatics/Lab/tsackton/rotifer_tmp/compleasm_db
  hap_aln_preset: asm20              # minimap2 preset hap-vs-purged (allelic dups can be % divergent)
  redundancy_min_frac: 0.5           # hap contig aligned-fraction to purged above this => redundant
  cov_window_bp: 10000               # mosdepth window for the depth histograms
  meryl_k: 21                        # k-mer size for GenomeScope2 (10x reads)
  genomescope_ploidy: 2              # diploid model (ohnologs unalignable => separate loci)

# ARKS kmer mode (arcs-make arks). PROVENANCE: values below must match the run
# that produced the accepted scaffolds -- VERIFY against SLURM logs (README).
arks:
  output_glob: "draft*.scaffolds.fa"   # arcs-make writes <draft>_<params>.scaffolds.fa (DOT before scaffolds, not _)
  params: "c=5 m=50-10000 s=98 z=500 l=4 a=0.7 k=30"

# ============================================================================
# PHASE B -- de-chimerization cuts  (SET AT THE PHASE-A BREAK)
# ============================================================================
# CHOSEN BY HUMAN from Phase-A QC (synteny partner-tracks + ONT read-span):
# cut only where synteny says chromosome-boundary AND reads show no span.
# pos_mb is snapped to the nearest N-gap within cut_snap_bp. Leave lists EMPTY
# for a from-scratch run, populate after inspecting Phase-A QC. Values below are
# the 2026-07-22 draft decisions (record; RE-DERIVE for the final run).
cut_snap_bp: 20000
# cut_sites RE-DERIVED for the 2026-07-25 build from phaseB join_qc + MA x MM synteny.
# Rule: cut a scaffold gap only where the synteny partner SWITCHES (chromosome boundary)
# AND ONT reads do not span it. Full per-cut rationale: results/phaseB/cut-evidence.md.
cut_sites:
  MA:
    - {scaffold: scaffold1, pos_mb: 1.49}    # MMs3|MMs1 span0  -- trim 1.5Mb head
    - {scaffold: scaffold1, pos_mb: 31.11}   # MMs1|MMs4 span0  -- major arm boundary
    - {scaffold: scaffold1, pos_mb: 84.10}   # MMs4|MMs2 span0  -- trim 2.2Mb tail
    - {scaffold: scaffold2, pos_mb: 0.70}    # MMs3|MMs2 span0  -- trim 0.7Mb head
    - {scaffold: scaffold6, pos_mb: 11.45}   # MMs3|MMs2 span0
  MM:
    - {scaffold: scaffold1, pos_mb: 55.84}   # MAs3|MAs1 span7  -- marginal, included per review
    - {scaffold: scaffold1, pos_mb: 110.99}  # MAs1|MAs4 span3  -- trim 1.1Mb tail
    - {scaffold: scaffold2, pos_mb: 46.90}   # MAs1|MAs2 span0  -- major arm boundary

# ---- cross-isolate synteny (used in BOTH phase A on scaffolds and B on cuts) --
synteny:
  preset: asm5                  # MA vs MM orthologs validated ~98.5% id (~1.5% divergent) -> asm5
  min_aln_bp: 1000000           # min shared aligned bp to draw a correspondence edge
  min_id: 0.90                  # min gap-compressed %id (from de:f:) for an ORTHOLOG edge.
                                #   below = diverged paralog/ohnolog: kept in edges.tsv but
                                #   excluded from correspondence grouping (orthologs ~98.5%).
  dotplot_min_len_bp: 20000     # min alignment length to plot

# ============================================================================
# PHASE C -- consensus reference  (SET AT THE PHASE-B BREAK)
# ============================================================================
# Built from the per-isolate cut assemblies by best-per-chromosome selection +
# optional joins + unplaced carry-through. Contig names are ISOLATE-PREFIXED
# (MA:<name> / MM:<name>) because the two isolates share scaffold names.
# PROVENANCE: chosen from the Phase-B correspondence table (README). Values below
# are the 2026-07-22 draft _reps.txt; RE-DERIVE for the final run.
consensus:
  gap_len: 100                  # N-run length inserted at any join
  chromosomes:                  # name -> representative source contig
    - {name: chr01, take: "MM:scaffold3"}
    - {name: chr02, take: "MM:scaffold4_p1"}
    - {name: chr03, take: "MM:scaffold4_p2"}
    - {name: chr04, take: "MA:scaffold2_p1"}
    - {name: chr05, take: "MM:scaffold1_p2"}
    - {name: chr06, take: "MA:scaffold1_p1"}
    - {name: chr07, take: "MM:scaffold2_p1"}
    - {name: chr08, take: "MM:scaffold2_p2"}
  joins: []                     # optional: [{name: chrNN, pieces: ["MA:x","MA:y"]}]
  unplaced:                     # carried through, renamed unpl01.. in size order
    - "MA:scaffold6"
    - "MA:scaffold7"
    - "MA:scaffold8"
    - "MA:scaffold9"
    - "MM:scaffold6"
    - "MM:scaffold7"
    - "MM:scaffold12"
    - "MM:scaffold16"
    - "MM:scaffold17"

# ---- contamination screen on the consensus --------------------------------
# PROVENANCE: unpl02/unpl03 (MM scaffold6/7) flagged this session (GC ~66%,
# bacterial). Screen flags candidates; `drop_contigs` is the reviewed removal
# list (a small manual confirm) -> produces the CLEANED final reference.
contam:
  gc_flag_high: 0.50            # flag contigs with GC above this (rotifer core ~0.30)
  run_blast: true               # windowed blastn->nt + blastx->nr taxonomy on flagged
  nt_db: /n/netscratch/informatics/Everyone/external_repos/blast/nt/latest/nt
  nr_db: /n/netscratch/informatics/Everyone/external_repos/blast/nr/latest/nr
  # DB-split parallel blast (Phase-0 prep_report): nt has 334 volumes; search each
  # group of this-many volumes against the full window set as a parallel job, then
  # merge best hits (nt scanned once total). ~34 jobs/isolate at 10 vols/job.
  nt_dbsize: 3980994145776       # total nt bases (blastdbcmd -info) -> per-volume e-values on full-nt scale
  blast_volumes_per_job: 10
  windows_per_contig: 20
  window_bp: 2000
  drop_contigs: []              # SET after reviewing contam_report. CONFIRMED bacterial
                                # 2026-07-23 (blastn nt): MM scaffold6 = Reyranella/Enhydrobacter
                                # (a-proteobacteria); MM scaffold7 = Variovorax sp. WT075 (100% id).
                                # In the draft these were consensus unpl02/unpl03 -> drop by final name.

# ============================================================================
# QC thresholds (exposed so results are reproducible / auditable)
# ============================================================================
qc:
  meryl_k: 19                   # merqury k-mer size (standard for ~300 Mb genome)
  merqury_reads: R2             # 10x reads used for meryl (R2 = genomic; R1 has barcode)
  cov_collapse_ratio: 1.7       # per-scaffold depth / median > this  -> COLLAPSE flag
  cov_lowcov_frac: 0.3          # per-scaffold depth < frac * median  -> LOWCOV flag
  telo_topkmer_frac: 0.25       # terminal dominant-6mer fraction     -> telomere array
  telo_canonical_frac: 0.30     # terminal TTAGGG-family density       -> telomere
  join_qc_min_scaffold_mb: 10   # only report join QC for scaffolds >= this
  join_qc_flank_bp: 3000        # +/- window a read must span to "support" a gap
  join_qc_min_span: 5           # spanning reads below this -> UNSUPPORTED (candidate cut)
